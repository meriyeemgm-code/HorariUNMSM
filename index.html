<style>
:root {
    --primary: #172554;
    --primary2: #2563eb;
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #f59e0b;
    --proposal: #f97316;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button {
    font-family: inherit;
}

.app {
    min-height: 100vh;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #172554, #1e3a8a);
    color: white;
    padding: 22px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    background: rgba(255,255,255,.12);
    display: grid;
    place-items: center;
    font-size: 23px;
}

.brand h1 {
    margin: 0;
    font-size: 21px;
}

.brand p {
    margin: 4px 0 0;
    opacity: .75;
    font-size: 13px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.btn {
    border: 0;
    border-radius: 10px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: 700;
    transition: .2s;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-primary {
    background: white;
    color: var(--primary);
}

.btn-blue {
    background: var(--primary2);
    color: white;
}

.btn-danger {
    background: #fee2e2;
    color: #991b1b;
}

.btn-light {
    background: #f1f5f9;
    color: #334155;
}

/* LAYOUT */
.main {
    padding: 22px;
    display: grid;
    grid-template-columns: 350px minmax(0, 1fr);
    gap: 22px;
}

.sidebar {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(15,23,42,.04);
}

/* PROGRESS */
.progress-panel {
    padding: 18px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.progress-title {
    font-size: 14px;
    font-weight: 800;
}

.progress-number {
    color: var(--primary2);
    font-weight: 900;
}

.progress-bar {
    margin-top: 12px;
    height: 9px;
    background: #e2e8f0;
    border-radius: 50px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg,#2563eb,#60a5fa);
    transition: width .3s;
}

/* COURSES */
.courses-panel {
    padding: 14px;
}

.section-title {
    padding: 4px 6px 12px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    font-weight: 900;
}

.course {
    border: 1px solid var(--border);
    border-radius: 13px;
    margin-bottom: 9px;
    overflow: hidden;
    background: white;
}

.course-header {
    padding: 13px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.course-header:hover {
    background: #f8fafc;
}

.course-name {
    font-size: 14px;
    font-weight: 800;
}

.course-code {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
}

.status {
    min-width: 25px;
    height: 25px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 900;
}

.status.ok {
    background: #dcfce7;
    color: #15803d;
}

.status.empty {
    background: #f1f5f9;
    color: #94a3b8;
}

.options {
    display: none;
    padding: 0 9px 9px;
    background: #f8fafc;
}

.course.open .options {
    display: block;
}

.option {
    position: relative;
    padding: 11px;
    border: 1px solid var(--border);
    background: white;
    border-radius: 11px;
    margin-top: 8px;
    cursor: pointer;
    transition: .2s;
}

.option:hover:not(.disabled) {
    border-color: #93c5fd;
    transform: translateX(2px);
}

.option.selected {
    border: 2px solid var(--primary2);
    background: #eff6ff;
}

.option.disabled {
    opacity: .45;
    cursor: not-allowed;
    background: #f1f5f9;
}

.option-title {
    font-size: 12px;
    font-weight: 900;
}

.option-info {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.45;
}

.proposal {
    border-color: #fed7aa;
    background: #fff7ed;
}

.proposal .option-title {
    color: #c2410c;
}

.badge {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 7px;
    border-radius: 20px;
    font-size: 9px;
    font-weight: 900;
    text-transform: uppercase;
}

.badge-proposal {
    background: #ffedd5;
    color: #c2410c;
}

.badge-selected {
    background: #dbeafe;
    color: #1d4ed8;
}

/* RIGHT */
.content {
    min-width: 0;
}

.calendar-panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
}

.calendar-header {
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.calendar-title h2 {
    margin: 0;
    font-size: 18px;
}

.calendar-title p {
    margin: 5px 0 0;
    font-size: 12px;
    color: var(--muted);
}

.calendar {
    overflow-x: auto;
}

.calendar-grid {
    min-width: 850px;
    display: grid;
    grid-template-columns: 65px repeat(6, 1fr);
}

.day {
    border-left: 1px solid var(--border);
    min-width: 120px;
}

.day-name {
    height: 44px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 900;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: #f8fafc;
}

.time-column {
    background: #f8fafc;
}

.time {
    height: 55px;
    border-bottom: 1px solid var(--border);
    padding: 5px;
    text-align: center;
    color: #94a3b8;
    font-size: 9px;
}

.day-body {
    position: relative;
    height: 770px;
    background-image:
        linear-gradient(to bottom, transparent 54px, #eef2f7 55px);
    background-size: 100% 55px;
}

/* EVENT */
.event {
    position: absolute;
    left: 5px;
    right: 5px;
    border-radius: 9px;
    padding: 7px;
    color: white;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(15,23,42,.15);
}

.event.normal {
    background: linear-gradient(135deg,#2563eb,#1d4ed8);
}

.event.proposal {
    background: linear-gradient(135deg,#f97316,#ea580c);
}

.event-title {
    font-size: 10px;
    font-weight: 900;
    line-height: 1.2;
}

.event-time {
    font-size: 9px;
    margin-top: 4px;
    opacity: .9;
}

/* EMPTY */
.empty-calendar {
    padding: 70px 20px;
    text-align: center;
    color: var(--muted);
}

.empty-icon {
    font-size: 42px;
    margin-bottom: 10px;
}

/* SAVED */
.saved-panel {
    margin-top: 18px;
    padding: 18px;
}

.saved-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.saved-header h3 {
    margin: 0;
}

.saved-list {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
    gap: 10px;
}

.saved-card {
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 13px;
}

.saved-card h4 {
    margin: 0;
}

.saved-meta {
    font-size: 11px;
    color: var(--muted);
    margin: 5px 0 12px;
}

.saved-actions {
    display: flex;
    gap: 6px;
}

.saved-actions button {
    flex: 1;
    padding: 7px;
    font-size: 11px;
}

/* MODAL */
.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.55);
    z-index: 100;
    padding: 20px;
    align-items: center;
    justify-content: center;
}

.modal-bg.active {
    display: flex;
}

.modal {
    background: white;
    width: min(600px,100%);
    max-height: 90vh;
    overflow: auto;
    border-radius: 20px;
    padding: 22px;
}

.modal h3 {
    margin-top: 0;
}

.input {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    font-size: 14px;
}

.input:focus {
    border-color: var(--primary2);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
}

/* COMPARE */
.compare-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
}

.compare-table th,
.compare-table td {
    border: 1px solid var(--border);
    padding: 8px;
    text-align: left;
}

.compare-table th {
    background: #f8fafc;
}

/* MOBILE */
@media(max-width: 950px) {
    .main {
        grid-template-columns: 1fr;
    }

    .sidebar {
        order: 2;
    }

    .content {
        order: 1;
    }
}

@media(max-width: 600px) {
    .header {
        padding: 17px;
        align-items: flex-start;
        flex-direction: column;
    }

    .header-actions {
        width: 100%;
    }

    .header-actions .btn {
        flex: 1;
    }

    .main {
        padding: 12px;
    }

    .calendar-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }
}
</style>
</head>

        <button class="btn btn-primary" onclick="openSaveModal()">

        </button>
    </div>
</header>


<main class="main">

<aside class="sidebar">

        </div>

    </section>


    <section class="panel courses-panel">

        </div>

        <div id="courses"></div>

    </section>

</aside>


<!-- CONTENT -->
<section class="content">

    <section class="calendar-panel">

        <div class="calendar-header">

            <div class="calendar-title">
                <h2>Mi horario semanal</h2>
                <p id="calendarStatus">

                </p>
            </div>

            <button class="btn btn-light" onclick="clearAll()">
                Limpiar todo
            </button>

        </div>

        <div class="calendar" id="calendar"></div>

    </section>


    <section class="panel saved-panel">

        <div class="saved-header">

            <h3>💾 Mis combinaciones</h3>

            <button class="btn btn-blue" onclick="openSaveModal()">
                + Guardar combinación
            </button>

        </div>

        <div class="saved-list" id="savedList"></div>

    </section>

</section>

</main>
</div>


<!-- SAVE MODAL -->
<div class="modal-bg" id="saveModal">

    <div class="modal">

        <h3>Guardar combinación</h3>

        <p style="color:#64748b;font-size:13px">
            Guarda esta selección para poder volver a ella posteriormente.
        </p>

        <input
            id="saveName"
            class="input"
            placeholder="Ej. Horario ideal"
        >

        <div id="saveInfo"
             style="margin-top:12px;font-size:12px;color:#64748b">
        </div>

        <div class="modal-actions">
            <button class="btn btn-light" onclick="closeModal('saveModal')">
                Cancelar
            </button>

            <button class="btn btn-blue" onclick="saveSchedule()">
                Guardar
            </button>
        </div>

    </div>
</div>


<!-- COMPARE MODAL -->
<div class="modal-bg" id="compareModal">

    <div class="modal">

        <h3>Comparar horarios guardados</h3>

        <div id="compareContent"></div>

        <div class="modal-actions">
            <button class="btn btn-light"
                    onclick="closeModal('compareModal')">
                Cerrar
            </button>
        </div>

    </div>
</div>

/* ============================================================
   ESTADO
   ============================================================ */

let selected = {};
let savedSchedules =
    JSON.parse(localStorage.getItem("horarios2026II") || "[]");


/* ============================================================
   UTILIDADES
   ============================================================ */

const days = [
    "Lunes",
    "Martes",
    "Miércoles",
    "Jueves",
    "Viernes",
    "Sábado"
];

function timeToMinutes(time) {

    const [h,m] = time.split(":").map(Number);

    return h * 60 + m;
}

function formatTime(time) {

    let [h,m] = time.split(":").map(Number);

    const suffix = h >= 12 ? "pm" : "am";

    h = h % 12;

    if(h === 0) h = 12;

    return `${h}:${String(m).padStart(2,"0")} ${suffix}`;
}

function getCourse(courseId) {

    return courses.find(c => c.id === courseId);
}

function getOption(courseId, optionId) {

    const course = getCourse(courseId);

    return course?.options.find(o => o.id === optionId);
}


/* ============================================================
   CRUCES
   ============================================================ */

function blocksConflict(a,b) {

    if(a[0] !== b[0]) return false;

    const startA = timeToMinutes(a[1]);
    const endA = timeToMinutes(a[2]);

    const startB = timeToMinutes(b[1]);
    const endB = timeToMinutes(b[2]);

    return startA < endB && endA > startB;
}


function optionsConflict(optionA, optionB) {

    return optionA.blocks.some(blockA =>
        optionB.blocks.some(blockB =>
            blocksConflict(blockA, blockB)
        )
    );
}


function conflictsWithSelected(courseId, option) {

    return Object.entries(selected).some(([id, optionId]) => {

        if(id === courseId) return false;

        const other = getOption(id, optionId);

        if(!other) return false;

        return optionsConflict(option, other);
    });
}


/* ============================================================
   RENDER CURSOS
   ============================================================ */

function renderCourses() {

    const container = document.getElementById("courses");

    container.innerHTML = "";

    courses.forEach(course => {

        const isSelected = !!selected[course.id];

        const wrapper = document.createElement("div");

        wrapper.className =
            "course" +
            (isSelected ? " open" : "");

        wrapper.id = `course-${course.id}`;

        wrapper.innerHTML = `

            <div class="course-header"
                 onclick="toggleCourse('${course.id}')">

                <div>
                    <div class="course-name">
                        ${course.name}
                    </div>

                    <div class="course-code">
                        ${course.code}
                    </div>
                </div>

                <div class="status ${isSelected ? "ok" : "empty"}">
                    ${isSelected ? "✓" : "○"}
                </div>

            </div>

            <div class="options">

                ${course.options.map(option =>
                    renderOption(course,option)
                ).join("")}

            </div>
        `;

        container.appendChild(wrapper);
    });
}


function renderOption(course, option) {

    const isSelected =
        selected[course.id] === option.id;

    const blocked =
        !isSelected &&
        conflictsWithSelected(course.id,option);

    const classes = [
        "option",
        option.proposal ? "proposal" : "",
        isSelected ? "selected" : "",
        blocked ? "disabled" : ""
    ].join(" ");

    const blocksText = option.blocks.map(block =>
        `${block[0]} · ${formatTime(block[1])} – ${formatTime(block[2])}`
    ).join("<br>");

    return `

        <div class="${classes}"
             onclick="${blocked ? "" :
                `selectOption('${course.id}','${option.id}')`}">

            <div class="option-title">
                ${isSelected ? "✓ " : ""}
                Sección ${option.section}
            </div>

            <div class="option-info">
                ${blocksText}<br>
                ${option.teacher}<br>
                Aula: ${option.room}
            </div>

            ${
                option.proposal
                ? `<span class="badge badge-proposal">
                    Contratación
                   </span>`
                : ""
            }

            ${
                isSelected
                ? `<span class="badge badge-selected">
                    Seleccionado
                   </span>`
                : ""
            }

            ${
                blocked
                ? `<div style="
                    margin-top:6px;
                    font-size:10px;
                    color:#b91c1c;
                    font-weight:800">
                    ⚠ BLOQUEADO POR CRUCE
                   </div>`
                : ""
            }

        </div>
    `;
}


/* ============================================================
   SELECCIÓN
   ============================================================ */

function toggleCourse(courseId) {

    const el = document.getElementById(`course-${courseId}`);

    el.classList.toggle("open");
}


function selectOption(courseId, optionId) {

    const option = getOption(courseId,optionId);

    if(!option) return;

    if(conflictsWithSelected(courseId,option)) {

        alert("Este horario tiene un cruce con otro curso seleccionado.");

        return;
    }

    selected[courseId] = optionId;

    renderAll();

    const courseEl =
        document.getElementById(`course-${courseId}`);

    if(courseEl) courseEl.classList.add("open");
}


function removeCourse(courseId) {

    delete selected[courseId];

    renderAll();
}


function clearAll() {

    if(!Object.keys(selected).length) return;

    if(confirm("¿Quieres eliminar todos los horarios seleccionados?")) {

        selected = {};

        renderAll();
    }
}


/* ============================================================
   PROGRESO
   ============================================================ */

function renderProgress() {

    const count =
        Object.keys(selected).length;

    const total =
        courses.length;

    document.getElementById("progressText")
        .textContent = `${count} / ${total}`;

    document.getElementById("progressFill")
        .style.width =
        `${(count / total) * 100}%`;

    document.getElementById("calendarStatus")
        .textContent =
        count === total
        ? "✓ Horario completo · sin cruces"
        : `${count} de ${total} cursos seleccionados`;
}


/* ============================================================
   CALENDARIO
   ============================================================ */

const CALENDAR_START = 7 * 60;
const CALENDAR_END = 22 * 60;
const PIXELS_PER_HOUR = 55;


function renderCalendar() {

    const calendar =
        document.getElementById("calendar");

    if(!Object.keys(selected).length) {

        calendar.innerHTML = `

            <div class="empty-calendar">

                <div class="empty-icon">📅</div>

                <strong>
                    Tu calendario está vacío
                </strong>

                <p>
                    Selecciona un horario para cualquiera
                    de tus cursos.
                </p>

            </div>
        `;

        return;
    }

    let html = `<div class="calendar-grid">`;

    html += `
        <div class="time-column">
            <div class="day-name"></div>
            <div>
                ${renderTimes()}
            </div>
        </div>
    `;

    days.forEach(day => {

        html += `

            <div class="day">

                <div class="day-name">
                    ${day}
                </div>

                <div class="day-body">

                    ${
                        renderDayEvents(day)
                    }

                </div>

            </div>
        `;
    });

    html += "</div>";

    calendar.innerHTML = html;
}


function renderTimes() {

    let html = "";

    for(
        let minutes = CALENDAR_START;
        minutes <= CALENDAR_END;
        minutes += 60
    ) {

        let h = Math.floor(minutes / 60);

        let label =
            `${String(h).padStart(2,"0")}:00`;

        html += `
            <div class="time">
                ${label}
            </div>
        `;
    }

    return html;
}


function renderDayEvents(day) {

    let html = "";

    Object.entries(selected).forEach(
        ([courseId,optionId]) => {

            const course = getCourse(courseId);

            const option =
                getOption(courseId,optionId);

            option.blocks
                .filter(block => block[0] === day)
                .forEach(block => {

                    const start =
                        timeToMinutes(block[1]);

                    const end =
                        timeToMinutes(block[2]);

                    const top =
                        ((start - CALENDAR_START) / 60)
                        * PIXELS_PER_HOUR;

                    const height =
                        ((end - start) / 60)
                        * PIXELS_PER_HOUR;

                    html += `

                        <div
                            class="event ${
                                option.proposal
                                ? "proposal"
                                : "normal"
                            }"
                            style="
                                top:${top}px;
                                height:${height}px;
                            "
                            onclick="removeCourse('${course.id}')"
                            title="Haz clic para quitar ${course.name}"
                        >

                            <div class="event-title">
                                ${course.name}
                            </div>

                            <div class="event-time">
                                ${formatTime(block[1])}
                                -
                                ${formatTime(block[2])}
                            </div>

                            <div style="
                                font-size:8px;
                                margin-top:3px">
                                Sec. ${option.section}
                            </div>

                        </div>
                    `;
                });
        }
    );

    return html;
}


/* ============================================================
   GUARDAR
   ============================================================ */

function openSaveModal() {

    const count =
        Object.keys(selected).length;

    if(!count) {

        alert("Selecciona al menos un curso antes de guardar.");

        return;
    }

    document.getElementById("saveName").value = "";

    document.getElementById("saveInfo")
        .textContent =
        `${count} de ${courses.length} cursos seleccionados.`;

    document.getElementById("saveModal")
        .classList.add("active");
}


function saveSchedule() {

    const name =
        document.getElementById("saveName")
            .value.trim();

    if(!name) {

        alert("Escribe un nombre para el horario.");

        return;
    }

    const copy =
        JSON.parse(JSON.stringify(selected));

    savedSchedules.push({

        id: Date.now(),

        name,

        selected: copy,

        created:
            new Date().toLocaleString("es-PE")

    });

    localStorage.setItem(
        "horarios2026II",
        JSON.stringify(savedSchedules)
    );

    closeModal("saveModal");

    renderSaved();
}


function openSaved(id) {

    const saved =
        savedSchedules.find(x => x.id === id);

    if(!saved) return;

    selected =
        JSON.parse(JSON.stringify(saved.selected));

    renderAll();
}


function deleteSaved(id) {

    if(!confirm("¿Eliminar esta combinación guardada?"))
        return;

    savedSchedules =
        savedSchedules.filter(x => x.id !== id);

    localStorage.setItem(
        "horarios2026II",
        JSON.stringify(savedSchedules)
    );

    renderSaved();
}


function duplicateSaved(id) {

    const saved =
        savedSchedules.find(x => x.id === id);

    if(!saved) return;

    savedSchedules.push({

        id: Date.now(),

        name: saved.name + " - copia",

        selected:
            JSON.parse(JSON.stringify(saved.selected)),

        created:
            new Date().toLocaleString("es-PE")

    });

    localStorage.setItem(
        "horarios2026II",
        JSON.stringify(savedSchedules)
    );

    renderSaved();
}


function renderSaved() {

    const container =
        document.getElementById("savedList");

    if(!savedSchedules.length) {

        container.innerHTML = `
            <div style="
                color:#64748b;
                font-size:13px;
                padding:10px 0">
                Todavía no tienes combinaciones guardadas.
            </div>
        `;

        return;
    }

    container.innerHTML =
        savedSchedules.map(saved => {

            const count =
                Object.keys(saved.selected).length;

            return `

                <div class="saved-card">

                    <h4>
                        ${escapeHtml(saved.name)}
                    </h4>

                    <div class="saved-meta">
                        ${count}/${courses.length} cursos
                        · ${saved.created}
                    </div>

                    <div class="saved-actions">

                        <button
                            class="btn btn-blue"
                            onclick="openSaved(${saved.id})">
                            Abrir
                        </button>

                        <button
                            class="btn btn-light"
                            onclick="duplicateSaved(${saved.id})">
                            Duplicar
                        </button>

                        <button
                            class="btn btn-danger"
                            onclick="deleteSaved(${saved.id})">
                            ×
                        </button>

                    </div>

                </div>
            `;

        }).join("");
}


/* ============================================================
   COMPARAR
   ============================================================ */

function openCompare() {

    const container =
        document.getElementById("compareContent");

    if(savedSchedules.length < 2) {

        container.innerHTML = `
            <p style="color:#64748b">
                Guarda al menos dos combinaciones para compararlas.
            </p>
        `;

        document.getElementById("compareModal")
            .classList.add("active");

        return;
    }

    let html = `
        <div style="overflow:auto">

        <table class="compare-table">

            <thead>
                <tr>
                    <th>Curso</th>
                    ${savedSchedules.map(s =>
                        `<th>${escapeHtml(s.name)}</th>`
                    ).join("")}
                </tr>
            </thead>

            <tbody>
    `;

    courses.forEach(course => {

        html += `<tr>`;

        html += `
            <td>
                <strong>${course.name}</strong>
            </td>
        `;

        savedSchedules.forEach(saved => {

            const option =
                getOption(
                    course.id,
                    saved.selected[course.id]
                );

            if(!option) {

                html += `<td>—</td>`;

            } else {

                html += `
                    <td>
                        Sec. ${option.section}<br>
                        ${option.blocks.map(b =>
                            `${b[0]} ${formatTime(b[1])}-${formatTime(b[2])}`
                        ).join("<br>")}
                    </td>
                `;
            }
        });

        html += `</tr>`;
    });

    html += `
            </tbody>
        </table>

        </div>
    `;

    container.innerHTML = html;

    document.getElementById("compareModal")
        .classList.add("active");
}


/* ============================================================
   MODAL
   ============================================================ */

function closeModal(id) {

    document.getElementById(id)
        .classList.remove("active");
}


document.querySelectorAll(".modal-bg")
    .forEach(bg => {

        bg.addEventListener("click", e => {

            if(e.target === bg)
                bg.classList.remove("active");

        });
    });


/* ============================================================
   SEGURIDAD HTML
   ============================================================ */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* ============================================================
   RENDER GENERAL
   ============================================================ */

function renderAll() {

    renderCourses();

    renderProgress();

    renderCalendar();

    renderSaved();
}


/* ============================================================
   INICIAR
   ============================================================ */

renderAll();

</script>
