<title>HorariUNMSM</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #1f2937;
}

/* =========================
   HEADER
========================= */

header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 20px;
    color: #7f1d1d;
}

.logo-icon {
    width: 38px;
    height: 38px;
    background: #991b1b;
    color: white;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
}

header span {
    font-size: 12px;
    color: #6b7280;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
}

.hero {
    margin-bottom: 35px;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.hero h1 span {
    color: #991b1b;
}

.hero p {
    color: #6b7280;
    line-height: 1.6;
}

/* =========================
   PANEL
========================= */

.panel {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 30px;
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.panel h2 {
    font-size: 21px;
}

.semester {
    background: #fef2f2;
    color: #991b1b;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
}

/* =========================
   FILTERS
========================= */

.filters {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.filter-button {
    border: 1px solid #d1d5db;
    background: white;
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

.filter-button.active {
    background: #991b1b;
    color: white;
    border-color: #991b1b;
}

/* =========================
   COURSES
========================= */

.courses {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.course {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    transition: .2s;
}

.course:hover {
    border-color: #991b1b;
}

.course.selected {
    border-color: #991b1b;
    background: #fff7f7;
}

.course-top {
    display: flex;
    gap: 10px;
    align-items: flex-start;
}

.course input {
    margin-top: 4px;
}

.course-name {
    font-weight: 700;
}

.course-code {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 4px;
}

/* =========================
   BUTTON
========================= */

.generate {
    margin-top: 25px;
    width: 100%;
    background: #991b1b;
    border: none;
    color: white;
    padding: 15px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.generate:hover {
    background: #7f1d1d;
}

/* =========================
   RESULTS
========================= */

.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.results-count {
    color: #6b7280;
    font-size: 14px;
}

.result {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    margin-bottom: 25px;
    overflow: hidden;
}

.result-header {
    padding: 16px 20px;
    background: #111827;
    color: white;
    display: flex;
    justify-content: space-between;
}

.result-header strong {
    color: white;
}

.result-number {
    color: #d1d5db;
    font-size: 13px;
}

.schedule {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    min-height: 320px;
}

.day {
    border-right: 1px solid #e5e7eb;
}

.day:last-child {
    border-right: none;
}

.day-title {
    text-align: center;
    font-weight: bold;
    font-size: 12px;
    padding: 12px 5px;
    background: #f9fafb;
    border-bottom: 1px solid #e5e7eb;
}

.day-content {
    padding: 8px;
}

.class {
    border-radius: 8px;
    padding: 9px;
    margin-bottom: 8px;
    font-size: 11px;
    line-height: 1.35;
}

.class strong {
    display: block;
    margin-bottom: 3px;
}

.official {
    background: #fee2e2;
    color: #991b1b;
}

.proposal {
    background: #fef3c7;
    color: #92400e;
}

.empty {
    color: #d1d5db;
    text-align: center;
    font-size: 11px;
    margin-top: 20px;
}

.result-info {
    padding: 15px 20px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 13px;
    color: #6b7280;
}

/* =========================
   MESSAGE
========================= */

.message {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #9a3412;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: none;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 800px) {

    .courses {
        grid-template-columns: 1fr;
    }

    .schedule {
        overflow-x: auto;
        display: grid;
        grid-template-columns: repeat(6, minmax(130px, 1fr));
    }

    .hero h1 {
        font-size: 32px;
    }
}

</style>
</head>

/* =====================================================
   ESTADO DE LA APLICACIÓN
===================================================== */

let filtroActual = "todos";


/* =====================================================
   MOSTRAR CURSOS
===================================================== */

function mostrarCursos() {

    const contenedor = document.getElementById("courses");

    contenedor.innerHTML = "";

    cursos
        .filter(curso => {

            if (filtroActual === "todos") {
                return true;
            }

            return curso.semestre === filtroActual;

        })
        .forEach(curso => {

            const div = document.createElement("div");

            div.className = "course";

            div.onclick = function(e) {

                if (e.target.tagName !== "INPUT") {

                    const checkbox =
                        div.querySelector("input");

                    checkbox.checked =
                        !checkbox.checked;

                    actualizarSeleccion(div);

                }

            };


            div.innerHTML = `

                <div class="course-top">

                    <input
                        type="checkbox"
                        value="${curso.codigo}"
                        onchange="actualizarSeleccion(this.parentElement.parentElement)"
                    >

                    <div>

                        <div class="course-name">
                            ${curso.nombre}
                        </div>

                        <div class="course-code">
                            Código: ${curso.codigo}
                        </div>

                    </div>

                </div>

            `;


            contenedor.appendChild(div);

        });

}


function actualizarSeleccion(elemento) {

    if (elemento.querySelector("input").checked) {

        elemento.classList.add("selected");

    } else {

        elemento.classList.remove("selected");

    }

}


/* =====================================================
   FILTRO
===================================================== */

function filtrarSemestre(semestre, boton) {

    filtroActual = semestre;

    document
        .querySelectorAll(".filter-button")
        .forEach(b => b.classList.remove("active"));

    boton.classList.add("active");

    mostrarCursos();

}


/* =====================================================
   CONVERTIR HORA
===================================================== */

function minutos(hora) {

    const partes = hora.split(":");

    return Number(partes[0]) * 60 +
           Number(partes[1]);

}


/* =====================================================
   DETECTAR CRUCE
===================================================== */

function hayCruce(sesionA, sesionB) {

    if (sesionA.dia !== sesionB.dia) {

        return false;

    }

    const inicioA = minutos(sesionA.inicio);
    const finA = minutos(sesionA.fin);

    const inicioB = minutos(sesionB.inicio);
    const finB = minutos(sesionB.fin);


    return (
        inicioA < finB &&
        inicioB < finA
    );

}


/* =====================================================
   VALIDAR HORARIO
===================================================== */

function horarioValido(horario) {

    const sesiones = [];

    horario.forEach(opcion => {

        opcion.sesiones.forEach(sesion => {

            sesiones.push(sesion);

        });

    });


    for (let i = 0; i < sesiones.length; i++) {

        for (
            let j = i + 1;
            j < sesiones.length;
            j++
        ) {

            if (
                hayCruce(
                    sesiones[i],
                    sesiones[j]
                )
            ) {

                return false;

            }

        }

    }


    return true;

}


/* =====================================================
   GENERAR COMBINACIONES
===================================================== */

function generarHorarios() {

    const seleccionados =
        Array.from(
            document.querySelectorAll(
                "#courses input:checked"
            )
        ).map(input => input.value);


    const mensaje =
        document.getElementById("message");

    const resultados =
        document.getElementById("results");

    const contador =
        document.getElementById("resultsCount");


    mensaje.style.display = "none";

    resultados.innerHTML = "";


    if (seleccionados.length === 0) {

        mensaje.innerText =
            "⚠️ Primero selecciona al menos un curso.";

        mensaje.style.display = "block";

        contador.innerText =
            "Sin cursos seleccionados";

        return;

    }


    const cursosElegidos =
        cursos.filter(curso =>
            seleccionados.includes(curso.codigo)
        );


    let combinaciones = [];


    function combinar(indice, actual) {

        if (combinaciones.length >= 100) {

            return;

        }


        if (indice === cursosElegidos.length) {

            if (horarioValido(actual)) {

                combinaciones.push([...actual]);

            }

            return;

        }


        const curso =
            cursosElegidos[indice];


        curso.secciones.forEach(seccion => {

            combinar(
                indice + 1,
                [
                    ...actual,
                    {
                        ...seccion,
                        curso: curso.nombre,
                        codigo: curso.codigo
                    }
                ]
            );

        });

    }


    combinar(0, []);


    contador.innerText =
        `${combinaciones.length} combinación(es) encontrada(s)`;


    if (combinaciones.length === 0) {

        mensaje.innerText =
            "❌ No encontramos una combinación sin cruces para los cursos seleccionados.";

        mensaje.style.display = "block";

        return;

    }


    combinaciones.forEach(
        (horario, indice) => {

            mostrarResultado(
                horario,
                indice + 1
            );

        }
    );

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
    horario,
    numero
) {

    const resultados =
        document.getElementById("results");


    const result =
        document.createElement("div");

    result.className = "result";


    const propuesta =
        horario.filter(
            x => x.estado === "propuesta"
        ).length;


    result.innerHTML = `

        <div class="result-header">

            <strong>
                Horario ${numero}
            </strong>

            <span class="result-number">
                ${propuesta > 0
                    ? "Incluye propuesta"
                    : "Solo oficiales"}
            </span>

        </div>

        <div class="schedule">

            ${crearDia(
                "Lunes",
                horario
            )}

            ${crearDia(
                "Martes",
                horario
            )}

            ${crearDia(
                "Miércoles",
                horario
            )}

            ${crearDia(
                "Jueves",
                horario
            )}

            ${crearDia(
                "Viernes",
                horario
            )}

            ${crearDia(
                "Sábado",
                horario
            )}

        </div>

        <div class="result-info">

            ${horario.map(item => `

                <span>
                    <strong>
                        ${item.curso}
                    </strong>
                    · Sec. ${item.seccion}
                    · ${item.profesor}
                </span>

            `).join("")}

        </div>

    `;


    resultados.appendChild(result);

}


/* =====================================================
   CREAR DÍA
===================================================== */

function crearDia(
    dia,
    horario
) {

    const clases = [];


    horario.forEach(item => {

        item.sesiones.forEach(sesion => {

            if (sesion.dia === dia) {

                clases.push({
                    ...item,
                    sesion
                });

            }

        });

    });


    clases.sort(
        (a, b) =>
            minutos(a.sesion.inicio) -
            minutos(b.sesion.inicio)
    );


    return `

        <div class="day">

            <div class="day-title">
                ${dia}
            </div>

            <div class="day-content">

                ${
                    clases.length === 0

                    ? `
                        <div class="empty">
                            Libre
                        </div>
                    `

                    : clases.map(item => `

                        <div class="
                            class
                            ${item.estado === "propuesta"
                                ? "proposal"
                                : "official"}
                        ">

                            <strong>
                                ${item.curso}
                            </strong>

                            ${item.sesion.inicio}
                            -
                            ${item.sesion.fin}

                            <br>

                            Sec. ${item.seccion}

                            <br>

                            ${item.profesor}

                            <br>

                            Aula ${item.aula}

                        </div>

                    `).join("")
                }

            </div>

        </div>

    `;

}
