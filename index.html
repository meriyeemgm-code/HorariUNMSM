<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armador de Horario UNMSM</title>
    <style>
        :root {
            --primary: #2C3E50;
            --secondary: #18BC9C;
            --danger: #E74C3C;
            --warning: #F39C12;
            --background: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-dark: #212529;
            --border: #DEE2E6;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1, h2 {
            color: var(--primary);
            text-align: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .course-group {
            margin-bottom: 15px;
        }

        .course-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: var(--primary);
        }

        select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fff;
            font-size: 0.85em;
            text-overflow: ellipsis;
        }

        select:disabled {
            background-color: #e9ecef;
        }

        option:disabled {
            color: var(--danger);
        }

        .status-bar {
            margin-bottom: 15px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 4px;
            color: #0d47a1;
            font-weight: bold;
            text-align: center;
        }

        .save-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .save-controls {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .save-controls input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .btn {
            padding: 8px 12px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary { background: var(--primary); }
        .btn-success { background: #27AE60; }
        
        .btn:hover { opacity: 0.9; }

        .saved-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        .saved-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--background);
            padding: 8px 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .icon-btn {
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 0.8em;
        }

        .btn-edit { background: var(--warning); }
        .btn-del { background: var(--danger); }

        /* Calendario UI */
        .calendar-wrapper {
            overflow-x: auto;
        }

        .calendar {
            display: grid;
            grid-template-columns: 60px repeat(6, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }

        .header-cell, .time-cell, .day-cell {
            background: white;
            padding: 10px 5px;
            text-align: center;
            font-size: 0.85em;
        }

        .header-cell {
            font-weight: bold;
            background: var(--primary);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .day-cell {
            position: relative;
            height: 930px;
        }

        .class-block {
            position: absolute;
            left: 2px;
            right: 2px;
            color: #2C3E50;
            border-radius: 4px;
            padding: 6px;
            font-size: 0.85em; 
            line-height: 1.3;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .course-title {
            font-size: 1.15em;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .class-block::-webkit-scrollbar {
            width: 4px;
        }
        .class-block::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
        }

        .seccion-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.65);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.9em;
            margin-bottom: 4px;
            font-weight: bold;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Reglas para la Impresión */
        @media print {
            body {
                background: white;
                padding: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .dashboard {
                display: block;
            }
            .panel:first-child {
                display: none;
            }
            .calendar-wrapper {
                box-shadow: none;
                border: none;
                padding: 0;
            }
            h1 { display: none; }
        }
    </style>
</head>
<body>

                    <button class="btn btn-success" onclick="window.print()">Imprimir</button>
                </div>
                <ul class="saved-list" id="saved-list"></ul>
            </div>
        </div>

        <!-- Panel Derecho: Calendario Visual -->
        <div class="panel calendar-wrapper">

        </div>
    </div>

    const dayMap = { "Lunes": 1, "Martes": 2, "Miércoles": 3, "Jueves": 4, "Viernes": 5, "Sábado": 6 };

    function timeToMinutes(timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
    }

    const coursesData = rawCursos
        .filter(c => c.codigo !== "311022" && c.codigo !== "311030")
        .map(c => {
            const seccionesLimpias = c.secciones.filter(sec => 
                !sec.profesor.toLowerCase().includes("contratación") && 
                !sec.profesor.toLowerCase().includes("contratacion")
            );

            return {
                id: c.codigo,
                name: c.nombre,
                sections: seccionesLimpias.map((sec, index) => {
                    const dayNum = dayMap[sec.dia];
                    const startMin = timeToMinutes(sec.inicio);
                    const endMin = timeToMinutes(sec.fin);
                    
                    const numLimpio = sec.numero.replace('P', '');
                    const identificador = sec.estado === 'propuesta' 
                        ? `Sec ${numLimpio} (Prop.)` 
                        : `Sec ${sec.numero}`;
                        
                    const label = `${identificador} | ${sec.profesor} | Aula ${sec.aula} | ${sec.dia} ${sec.inicio}-${sec.fin}`;

                    return {
                        id: `${c.codigo}_${index}`,
                        label: label,
                        seccion: identificador, 
                        profesor: sec.profesor,
                        aula: sec.aula,
                        times: [{ day: dayNum, start: startMin, end: endMin }],
                        courseName: c.nombre,
                        inicioFormat: sec.inicio,
                        finFormat: sec.fin
                    };
                })
            };
        });

    let currentSelection = {};
    const CALENDAR_START_MIN = 420; 
    const CALENDAR_END_MIN = 1350; 
    const TOTAL_MINUTES = CALENDAR_END_MIN - CALENDAR_START_MIN;

    function init() {
        renderSelectors();
        renderCalendarGrid();
        loadSavedSchedules();
        updateUI();
    }

    function renderSelectors() {
        const container = document.getElementById('course-selectors');
        container.innerHTML = '';

        coursesData.forEach(course => {
            const div = document.createElement('div');
            div.className = 'course-group';
            
            const label = document.createElement('label');
            label.innerText = course.name;
            
            const select = document.createElement('select');
            select.id = `select-${course.id}`;
            select.innerHTML = `<option value="">-- Seleccionar horario --</option>`;
            
            course.sections.forEach(sec => {
                select.innerHTML += `<option value="${sec.id}">${sec.label}</option>`;
            });

            select.addEventListener('change', (e) => {
                if (e.target.value) {
                    currentSelection[course.id] = e.target.value;
                } else {
                    delete currentSelection[course.id];
                }
                updateUI();
            });

            div.appendChild(label);
            div.appendChild(select);
            container.appendChild(div);
        });
    }

    function renderCalendarGrid() {
        const cal = document.getElementById('calendar');
        cal.innerHTML = '<div class="header-cell">Hora</div>';
        
        const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        days.forEach(d => cal.innerHTML += `<div class="header-cell">${d}</div>`);

        let timeColumn = '<div style="background:white;">';
        for(let h=7; h<=22; h++) {
            timeColumn += `<div class="time-cell" style="height:60px; border-bottom:1px solid #eee;">${h}:00</div>`;
        }
        timeColumn += '</div>';
        cal.innerHTML += timeColumn;

        for(let i=1; i<=6; i++) {
            cal.innerHTML += `<div class="day-cell" id="day-${i}"></div>`;
        }
    }

    function updateUI() {
        const selectedSections = getSelectedSectionsData();
        
        const count = Object.keys(currentSelection).length;
        document.getElementById('status-bar').innerText = `Cursos seleccionados: ${count} / ${coursesData.length}`;

        coursesData.forEach(course => {
            const select = document.getElementById(`select-${course.id}`);
            select.value = currentSelection[course.id] || "";

            Array.from(select.options).forEach(opt => {
                if (opt.value === "") return;
                
                const secData = course.sections.find(s => s.id === opt.value);
                const hasConflict = checkConflict(secData, selectedSections, course.id);
                
                opt.disabled = hasConflict;
                if (hasConflict) {
                    opt.text = '⚠️ CRUCE - ' + secData.label;
                } else {
                    opt.text = secData.label;
                }
            });
        });

        drawCalendarBlocks(selectedSections);
    }

    function getSelectedSectionsData() {
        let result = [];
        for (const [courseId, secId] of Object.entries(currentSelection)) {
            const course = coursesData.find(c => c.id === courseId);
            const sec = course.sections.find(s => s.id === secId);
            result.push({ courseName: course.name, ...sec, courseId });
        }
        return result;
    }

    function checkConflict(section, selectedList, currentCourseId) {
        for (let sel of selectedList) {
            if (sel.courseId === currentCourseId) continue; 
            
            for (let t1 of section.times) {
                for (let t2 of sel.times) {
                    if (t1.day === t2.day) {
                        if (t1.start < t2.end && t1.end > t2.start) {
                            return true;
                        }
                    }
                }
            }
        }
        return false;
    }

    function drawCalendarBlocks(selectedSections) {
        for(let i=1; i<=6; i++) {
            document.getElementById(`day-${i}`).innerHTML = '';
        }

        const pastelColors = ['#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF', '#E0BBE4', '#F5C6EC'];
        
        selectedSections.forEach((sec, index) => {
            const color = pastelColors[index % pastelColors.length];
            
            sec.times.forEach(time => {
                const dayCol = document.getElementById(`day-${time.day}`);
                if (!dayCol) return;

                const block = document.createElement('div');
                block.className = 'class-block';
                block.style.backgroundColor = color;
                
                const topPercent = ((time.start - CALENDAR_START_MIN) / TOTAL_MINUTES) * 100;
                const heightPercent = ((time.end - time.start) / TOTAL_MINUTES) * 100;

                block.style.top = `${topPercent}%`;
                block.style.height = `${heightPercent}%`;
                
                block.innerHTML = `
                    <div style="text-align: center; margin-bottom: 2px;">
                        <div class="course-title">${sec.courseName}</div>
                        <span class="seccion-badge">${sec.seccion}</span>
                    </div>
                    <div style="text-align: center; margin-bottom: 4px; font-weight: 500;">
                        ${sec.inicioFormat} - ${sec.finFormat}
                    </div>
                    <div>
                        Prof: ${sec.profesor}<br/>
                        Aula: ${sec.aula}
                    </div>
                `;
                dayCol.appendChild(block);
            });
        });
    }

    function saveSchedule() {
        const nameInput = document.getElementById('save-name');
        const name = nameInput.value.trim();
        
        if (!name) {
            alert('Por favor, ingresa un nombre para guardar el horario.');
            return;
        }

        let saved = JSON.parse(localStorage.getItem('savedSchedules') || '{}');
        saved[name] = currentSelection;
        localStorage.setItem('savedSchedules', JSON.stringify(saved));
        
        nameInput.value = '';
        loadSavedSchedules();
    }

    function renameSchedule(oldName) {
        const newName = prompt(`Ingresa el nuevo nombre para "${oldName}":`, oldName);
        
        if (newName && newName.trim() !== "" && newName !== oldName) {
            let saved = JSON.parse(localStorage.getItem('savedSchedules') || '{}');
            
            if (saved[newName]) {
                alert('Ya existe un horario con ese nombre. Intenta con otro.');
                return;
            }
            
            saved[newName.trim()] = saved[oldName];
            delete saved[oldName];
            localStorage.setItem('savedSchedules', JSON.stringify(saved));
            loadSavedSchedules();
        }
    }

    function loadSavedSchedules() {
        const list = document.getElementById('saved-list');
        list.innerHTML = '';
        
        let saved = JSON.parse(localStorage.getItem('savedSchedules') || '{}');
        
        for (const [name, selection] of Object.entries(saved)) {
            const li = document.createElement('li');
            
            const span = document.createElement('span');
            span.innerText = name;
            span.style.flexGrow = 1;
            span.onclick = () => {
                currentSelection = {...selection};
                updateUI();
            };

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'action-btns';

            const editBtn = document.createElement('button');
            editBtn.innerText = '✏️';
            editBtn.className = 'icon-btn btn-edit';
            editBtn.title = 'Renombrar';
            editBtn.onclick = (e) => {
                e.stopPropagation();
                renameSchedule(name);
            };

            const delBtn = document.createElement('button');
            delBtn.innerText = 'X';
            delBtn.className = 'icon-btn btn-del';
            delBtn.title = 'Eliminar';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if(confirm(`¿Seguro que deseas eliminar la opción "${name}"?`)){
                    delete saved[name];
                    localStorage.setItem('savedSchedules', JSON.stringify(saved));
                    loadSavedSchedules();
                }
            };

            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(delBtn);

            li.appendChild(span);
            li.appendChild(actionsDiv);
            list.appendChild(li);
        }
    }

    window.onload = init;
</script>
</body>
</html>
